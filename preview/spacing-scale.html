<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--cv-font-body)}
  .r{display:flex;align-items:center;gap:12px;padding:4px 0}
  .bar{height:14px;background:var(--cv-green-600);border-radius:4px}
  .lab{width:70px;font-family:var(--cv-font-mono);font-size:11px;color:var(--cv-fg-3)}
  .px{font-size:11px;color:var(--cv-fg-3)}
</style></head>
<body>
  <div class="r"><div class="lab">sp-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
  <div class="r"><div class="lab">sp-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
  <div class="r"><div class="lab">sp-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
  <div class="r"><div class="lab">sp-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
  <div class="r"><div class="lab">sp-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
  <div class="r"><div class="lab">sp-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
  <div class="r"><div class="lab">sp-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
  <div class="r"><div class="lab">sp-16</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
  <div class="r"><div class="lab">sp-20</div><div class="bar" style="width:80px"></div><div class="px">80px</div></div>
</body></html>
