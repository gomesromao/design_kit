<!doctype html>
<html><head><meta charset="utf-8"><title>Talent halos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;font-family:var(--cv-font-body);background:#fff}
  .row{display:flex;gap:14px;align-items:center;justify-content:space-between}
  .h{display:flex;flex-direction:column;align-items:center;gap:6px}
  .dot{width:78px;height:78px;border-radius:999px;box-shadow:var(--cv-shadow-sm)}
  .name{font-weight:700;font-size:11px;color:var(--cv-navy-800)}
  .hex{font-family:var(--cv-font-mono);font-size:10px;color:var(--cv-fg-3)}
</style></head>
<body>
  <div class="row">
    <div class="h"><div class="dot" style="background:#2EC4C0"></div><div class="name">Teal</div><div class="hex">#2EC4C0</div></div>
    <div class="h"><div class="dot" style="background:#7B3FE4"></div><div class="name">Purple</div><div class="hex">#7B3FE4</div></div>
    <div class="h"><div class="dot" style="background:#C13EC1"></div><div class="name">Magenta</div><div class="hex">#C13EC1</div></div>
    <div class="h"><div class="dot" style="background:#2AB7F0"></div><div class="name">Cyan</div><div class="hex">#2AB7F0</div></div>
    <div class="h"><div class="dot" style="background:#F39A1F"></div><div class="name">Orange</div><div class="hex">#F39A1F</div></div>
    <div class="h"><div class="dot" style="background:#F4C430"></div><div class="name">Yellow</div><div class="hex">#F4C430</div></div>
    <div class="h"><div class="dot" style="background:#E54B4B"></div><div class="name">Red</div><div class="hex">#E54B4B</div></div>
  </div>
</body></html>
