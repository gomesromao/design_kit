<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;font-family:var(--cv-font-body);background:#fff}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:14px;padding:14px 14px 12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;box-shadow:var(--cv-shadow-xs)}
  .sw .name{font-weight:700;font-size:13px;letter-spacing:0.01em}
  .sw .hex{font-family:var(--cv-font-mono);font-size:11px;opacity:0.85;margin-top:auto}
  .sw.lt{color:var(--cv-navy-800)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:#07152B"><div class="name">Navy 900</div><div class="hex">#07152B</div></div>
    <div class="sw" style="background:#0B1E3F"><div class="name">Navy 800 · primary</div><div class="hex">#0B1E3F</div></div>
    <div class="sw" style="background:#122A52"><div class="name">Navy 700</div><div class="hex">#122A52</div></div>
    <div class="sw" style="background:#1E3A6B"><div class="name">Navy 600</div><div class="hex">#1E3A6B</div></div>
    <div class="sw" style="background:#2C4F8C"><div class="name">Navy 500</div><div class="hex">#2C4F8C</div></div>
    <div class="sw" style="background:#3F9A6E"><div class="name">Green 700</div><div class="hex">#3F9A6E</div></div>
    <div class="sw" style="background:#50B080"><div class="name">Green 600 · accent</div><div class="hex">#50B080</div></div>
    <div class="sw" style="background:#6EC79A"><div class="name">Green 500</div><div class="hex">#6EC79A</div></div>
    <div class="sw lt" style="background:#C0E5D2"><div class="name">Green 200 · puck</div><div class="hex">#C0E5D2</div></div>
    <div class="sw lt" style="background:#DEF2E6"><div class="name">Green 100</div><div class="hex">#DEF2E6</div></div>
  </div>
</body></html>
