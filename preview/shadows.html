<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px;background:#F7F7F4;font-family:var(--cv-font-body);display:flex;gap:24px;justify-content:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:130px;height:80px;background:#fff;border-radius:18px}
  .name{font-weight:700;font-size:11px;color:var(--cv-navy-800)}
  .lab{font-family:var(--cv-font-mono);font-size:9px;color:var(--cv-fg-3)}
</style></head>
<body>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-xs)"></div><div class="name">xs</div><div class="lab">y1 b2 5%</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-sm)"></div><div class="name">sm</div><div class="lab">y4 b12 6%</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-card)"></div><div class="name">card</div><div class="lab">y6 b20 6%</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-md)"></div><div class="name">md</div><div class="lab">y10 b28 8%</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-lg)"></div><div class="name">lg</div><div class="lab">y20 b48 12%</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--cv-shadow-pop)"></div><div class="name">pop</div><div class="lab">y16 b40 18%</div></div>
</body></html>
