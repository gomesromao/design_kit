<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--cv-font-body);display:flex;gap:14px;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{width:80px;height:80px;background:var(--cv-green-200);border:1px solid var(--cv-green-500)}
  .lab{font-family:var(--cv-font-mono);font-size:10px;color:var(--cv-fg-3)}
  .name{font-weight:700;font-size:11px;color:var(--cv-navy-800)}
</style></head>
<body>
  <div class="b"><div class="box" style="border-radius:8px"></div><div class="name">sm</div><div class="lab">8px</div></div>
  <div class="b"><div class="box" style="border-radius:14px"></div><div class="name">md</div><div class="lab">14px</div></div>
  <div class="b"><div class="box" style="border-radius:20px"></div><div class="name">lg</div><div class="lab">20px</div></div>
  <div class="b"><div class="box" style="border-radius:28px"></div><div class="name">xl</div><div class="lab">28px</div></div>
  <div class="b"><div class="box" style="border-radius:36px"></div><div class="name">2xl</div><div class="lab">36px</div></div>
  <div class="b"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="lab">999px</div></div>
</body></html>
