<!doctype html>
<html><head><meta charset="utf-8"><title>Dark CTA bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--cv-font-body)}
  .bar{position:relative;padding:36px 32px;background:url(../assets/footer-background.png) center/cover, var(--cv-bg-navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;border-radius:0}
  h2{font-family:var(--cv-font-display);font-weight:800;font-size:30px;letter-spacing:-0.018em;margin:0 0 6px}
  p{font-size:14px;color:#C8D2E2;margin:0}
  .btn{font-weight:700;font-size:14px;padding:14px 22px;border-radius:999px;background:#fff;color:var(--cv-navy-800);border:none;cursor:pointer;white-space:nowrap}
</style></head>
<body>
  <div class="bar">
    <div>
      <h2>Ready to Meet Your Match?</h2>
      <p>Start your 40-hour free trial and experience a new way to hire.</p>
    </div>
    <button class="btn">Start Hiring →</button>
  </div>
</body></html>
