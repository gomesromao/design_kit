<!doctype html>
<html><head><meta charset="utf-8"><title>Role chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--cv-font-body);display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 10px;border-radius:999px;background:#fff;border:1px solid var(--cv-border);font-weight:700;font-size:13px;color:var(--cv-navy-800);box-shadow:var(--cv-shadow-xs)}
  .chip img{width:22px;height:22px}
</style></head>
<body>
  <div class="chip"><img src="../assets/icons/role-ea.png">Executive Assistants</div>
  <div class="chip"><img src="../assets/icons/role-marketer.png">Digital Marketers</div>
  <div class="chip"><img src="../assets/icons/role-social.png">Social Media Managers</div>
  <div class="chip"><img src="../assets/icons/role-sales.png">Sales Reps</div>
  <div class="chip"><img src="../assets/icons/role-accounting.png">Accounting Assistants</div>
  <div class="chip"><img src="../assets/icons/role-frontend.png">Front-End Devs</div>
  <div class="chip"><img src="../assets/icons/role-backend.png">Back-End Devs</div>
  <div class="chip"><img src="../assets/icons/role-fullstack.png">Full-Stack Devs</div>
  <div class="chip"><img src="../assets/icons/role-ai.png">AI Specialists</div>
  <div class="chip"><img src="../assets/icons/role-designer.png">Graphic Designers</div>
</body></html>
