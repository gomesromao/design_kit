<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar stack</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--cv-font-body);display:flex;gap:30px;align-items:center;justify-content:center}
  .stack{display:flex}
  .a{
    width:54px;height:54px;border-radius:999px;
    border:3px solid #fff;
    margin-left:-14px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(7,21,43,0.10);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .a:first-child{margin-left:0}
  .a img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .copy{display:flex;flex-direction:column}
  .num{font-family:var(--cv-font-display);font-weight:800;font-size:24px;color:var(--cv-navy-800);letter-spacing:-0.01em}
  .lab{font-size:12px;font-weight:600;color:var(--cv-fg-3);letter-spacing:0.04em}
</style></head>
<body>
  <div class="stack">
    <div class="a" style="background:var(--cv-pastel-mint)"><img src="../assets/team/jam.png" alt=""></div>
    <div class="a" style="background:var(--cv-pastel-sky)"><img src="../assets/team/carmi.png" alt=""></div>
    <div class="a" style="background:var(--cv-pastel-mint)"><img src="../assets/team/ambo.png" alt=""></div>
    <div class="a" style="background:var(--cv-pastel-lav)"><img src="../assets/team/issa.png" alt=""></div>
    <div class="a" style="background:var(--cv-pastel-mint)"><img src="../assets/team/sheerah.png" alt=""></div>
    <div class="a" style="background:var(--cv-pastel-peach)"><img src="../assets/team/dona.png" alt=""></div>
  </div>
  <div class="copy">
    <div class="num">100K+ Talents</div>
    <div class="lab">VERIFIED PROFILES</div>
  </div>
</body></html>
