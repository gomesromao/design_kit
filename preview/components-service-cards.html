<!doctype html>
<html><head><meta charset="utf-8"><title>Service cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#FAF6EE;font-family:var(--cv-font-body);display:flex;gap:18px}
  .card{flex:1;background:#fff;border-radius:24px;padding:24px;box-shadow:var(--cv-shadow-card)}
  .puck{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .puck img{width:64px;height:64px;border-radius:999px}
  h3{font-family:var(--cv-font-display);font-weight:800;font-size:24px;color:var(--cv-navy-800);margin:0 0 8px;letter-spacing:-0.01em}
  p{font-size:14px;line-height:1.55;color:var(--cv-fg-2);margin:0 0 14px}
  .cta{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--cv-green-700)}
</style></head>
<body>
  <div class="card">
    <div class="puck"><img src="../assets/icons/service-managed-talent.png"></div>
    <h3>Managed Talent</h3>
    <p>We handle everything. Sourcing, vetting, payroll, compliance, and ongoing support. Month-to-month, no long-term contracts.</p>
    <div class="cta">Learn more →</div>
  </div>
  <div class="card">
    <div class="puck"><img src="../assets/icons/service-direct-hire.png"></div>
    <h3>Direct Hire</h3>
    <p>You hire directly after we match you. One-time flat fee. No markups, no hidden percentages.</p>
    <div class="cta">Learn more →</div>
  </div>
</body></html>
