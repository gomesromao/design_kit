<!doctype html>
<html><head><meta charset="utf-8"><title>Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--cv-font-body);display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
  .panel{padding:30px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .light{background:#fff;border-right:1px solid var(--cv-border)}
  .dark{background:#0A1A33}
  img{height:48px;width:auto;object-fit:contain;display:block}
  .lab{font-family:var(--cv-font-mono);font-size:10px;color:var(--cv-fg-3)}
  .dark .lab{color:#C8D2E2}
</style></head>
<body>
  <div class="panel light">
    <img src="../assets/logo-navy.png" alt="Coconut logo, navy">
    <div class="lab">logo-navy.png · primary</div>
  </div>
  <div class="panel dark">
    <img src="../assets/logo-white.png" alt="Coconut logo, white">
    <div class="lab">logo-white.png · inverse</div>
  </div>
</body></html>
