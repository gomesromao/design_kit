<!doctype html>
<html><head><meta charset="utf-8"><title>Talent card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#FAF6EE;font-family:var(--cv-font-body);display:flex;gap:18px;justify-content:center}
  .card{background:#fff;border-radius:24px;padding:18px;width:240px;box-shadow:var(--cv-shadow-card);position:relative}
  .halo{width:100%;aspect-ratio:1;border-radius:18px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
  .halo img{width:100%;height:100%;object-fit:cover;object-position:top}
  .name{font-family:var(--cv-font-display);font-weight:800;font-size:22px;color:var(--cv-navy-800);margin:14px 0 2px;letter-spacing:-0.01em}
  .role{font-size:13px;color:var(--cv-fg-3);font-weight:600;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--cv-fg-2);font-weight:600}
  .row img{width:12px;height:12px}
  .price{font-weight:800;color:var(--cv-navy-800)}
  .video{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--cv-green-700)}
</style></head>
<body>
  <div class="card">
    <div class="halo" style="background:#2EC4C0"><img src="../assets/talent/sheena.png" alt=""></div>
    <div class="name">Sheena</div>
    <div class="role">Executive Assistant</div>
    <div class="row"><img src="../assets/icons/poppy-pink.png">6+ Years Experience</div>
    <div class="row"><img src="../assets/icons/poppy-yellow.png"><span class="price">From $1,450/mo</span></div>
    <div class="video">▷ Intro Video</div>
  </div>
  <div class="card">
    <div class="halo" style="background:#F4C430"><img src="../assets/talent/veronica.png" alt=""></div>
    <div class="name">Veronica</div>
    <div class="role">Digital Marketer</div>
    <div class="row"><img src="../assets/icons/poppy-pink.png">9+ Years Experience</div>
    <div class="row"><img src="../assets/icons/poppy-yellow.png"><span class="price">From $1,700/mo</span></div>
    <div class="video">▷ Intro Video</div>
  </div>
  <div class="card">
    <div class="halo" style="background:#7B3FE4"><img src="../assets/talent/chermie.png" alt=""></div>
    <div class="name">Chermie</div>
    <div class="role">Social Media Manager</div>
    <div class="row"><img src="../assets/icons/poppy-pink.png">4+ Years Experience</div>
    <div class="row"><img src="../assets/icons/poppy-yellow.png"><span class="price">From $1,450/mo</span></div>
    <div class="video">▷ Intro Video</div>
  </div>
</body></html>
