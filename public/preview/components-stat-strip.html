<!doctype html>
<html><head><meta charset="utf-8"><title>Stat strip</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:linear-gradient(110deg,#FAF6EE 0%,#EAF5EE 100%);font-family:var(--cv-font-body)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:30px}
  .stat{text-align:center;flex:1}
  .stat .v{font-family:var(--cv-font-display);font-weight:800;font-size:42px;color:var(--cv-navy-800);letter-spacing:-0.02em;line-height:1}
  .stat .l{font-size:12px;font-weight:700;color:var(--cv-fg-3);letter-spacing:0.06em;text-transform:uppercase;margin-top:6px}
  .div{width:1px;height:50px;background:var(--cv-border)}
</style></head>
<body>
  <div class="row">
    <div class="stat"><div class="v">100K+</div><div class="l">Talent Pool</div></div>
    <div class="div"></div>
    <div class="stat"><div class="v">600+</div><div class="l">Companies Served</div></div>
    <div class="div"></div>
    <div class="stat"><div class="v">4.9/5</div><div class="l">Avg. Rating</div></div>
    <div class="div"></div>
    <div class="stat"><div class="v">97%</div><div class="l">Retention</div></div>
    <div class="div"></div>
    <div class="stat"><div class="v">40hr</div><div class="l">Free Trial</div></div>
  </div>
</body></html>
