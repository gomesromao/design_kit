<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography sample</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--cv-font-body)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px}
  .puck{width:56px;height:56px;border-radius:999px;background:#EAF5EE;display:flex;align-items:center;justify-content:center}
  .puck img{width:30px;height:30px}
  .lab{font-size:10px;color:var(--cv-fg-3);text-align:center}
</style></head>
<body>
  <div class="grid">
    <div class="ic"><div class="puck"><img src="../assets/icons/role-ea.png"></div><div class="lab">EA</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-marketer.png"></div><div class="lab">Marketer</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-social.png"></div><div class="lab">Social</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-sales.png"></div><div class="lab">Sales</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-accounting.png"></div><div class="lab">Acctg</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-frontend.png"></div><div class="lab">FE Dev</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-backend.png"></div><div class="lab">BE Dev</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-fullstack.png"></div><div class="lab">Full-Stack</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-ai.png"></div><div class="lab">AI</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/role-designer.png"></div><div class="lab">Designer</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-meet.png"></div><div class="lab">Meet</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-source.png"></div><div class="lab">Source</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-match.png"></div><div class="lab">Match</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-interview.png"></div><div class="lab">Interview</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-trial.png"></div><div class="lab">Trial</div></div>
    <div class="ic"><div class="puck"><img src="../assets/icons/step-hired.png"></div><div class="lab">Hired</div></div>
  </div>
</body></html>
