<!doctype html>
<html><head><meta charset="utf-8"><title>Process steps</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--cv-font-body)}
  .row{display:flex;gap:20px;justify-content:space-between;align-items:flex-start}
  .step{flex:1;text-align:center}
  .puck{width:64px;height:64px;border-radius:999px;background:var(--cv-green-200);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .puck img{width:36px;height:36px}
  .num{font-family:var(--cv-font-display);font-weight:800;font-size:14px;color:var(--cv-green-700);margin-bottom:4px}
  .name{font-family:var(--cv-font-display);font-weight:700;font-size:15px;color:var(--cv-navy-800)}
</style></head>
<body>
  <div class="row">
    <div class="step"><div class="puck"><img src="../assets/icons/step-meet.png"></div><div class="num">1</div><div class="name">Meet</div></div>
    <div class="step"><div class="puck"><img src="../assets/icons/step-source.png"></div><div class="num">2</div><div class="name">Source</div></div>
    <div class="step"><div class="puck"><img src="../assets/icons/step-match.png"></div><div class="num">3</div><div class="name">Match</div></div>
    <div class="step"><div class="puck"><img src="../assets/icons/step-interview.png"></div><div class="num">4</div><div class="name">Interview</div></div>
    <div class="step"><div class="puck"><img src="../assets/icons/step-trial.png"></div><div class="num">5</div><div class="name">Trial</div></div>
    <div class="step"><div class="puck"><img src="../assets/icons/step-hired.png"></div><div class="num">6</div><div class="name">Hire</div></div>
  </div>
</body></html>
